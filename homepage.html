<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="homepage.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Top Navbar for desktop -->
    <nav class="nav hidden md:flex justify-around">
      <a class="nav-link active" aria-current="page" href="#">Home</a>
      <a class="nav-link" href="#">Finances</a>
      <a class="nav-link" href="#">Calendar</a>
      <a class="nav-link" href="#">Budget</a>
      <a class="nav-link" href="#">Profile</a>
    </nav>

    <main
      class="flex flex-col justify-center items-center md:flex-row max-w-4xl mx-auto mt-10"
    >
      <!-- Portfolio name, balance, and hamburger menu -->
      <div class="flex flex-col md:mr-5">
        <div>
          <p class="text-center text-5xl mt-20 font-bold">My Portfolio</p>
          <p class="text-center text-5xl mt-4 font-semibold">$000.00</p>
          <img
            class="fixed top-20 left-10 md:hidden bg-white rounded-sm"
            src="svgs/hamburger_menu.svg"
            alt=""
            width="60"
            height="60"
          />
        </div>
        <!-- Graph -->
        <div class="flex justify-center p-5">
          <img src="add graph source here" alt="" width="400" height="300" />
        </div>
      </div>
      <!-- Quick finance view area -->
      <div
        class="flex flex-col max-w-3xl border-2 rounded-2xl min-w-[500px] flex-grow mt-10 md:mt-0"
      >
        <div class="flex items-center justify-center mb-10">
          <img src="svgs/chevron_left.svg" alt="" width="40" height="40" />
          <p class="text-2xl font-semibold">This Month</p>
        </div>
        <!-- Net expected -->
        <div class="flex flex-col mb-10 p-2">
          <p class="text-2xl ml-2 font-semibold">Net Expected</p>
          <div class="flex justify-between items-center">
            <p class="text-3xl ml-2">+$000.00</p>
            <p class="text-2xl mr-2">($000.00 - $000.00)</p>
          </div>
        </div>
        <!-- Income and Expenses accordion dropdowns -->
        <div class="accordion">
          <!-- Income -->
          <details class="accordion-item">
            <summary class="accordion-header">
              <div class="flex justify-between">
                <div class="flex flex-col">
                  <p class="text-2xl ml-2 font-semibold">Income</p>
                  <p class="text-3xl ml-2">$000.00</p>
                </div>
                <div class="flex items-center">
                  <img
                    src="svgs/add_plus.svg"
                    alt=""
                    width="40"
                    height="40"
                  /><svg
                    class="accordion-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    style="width: 32px; height: 32px"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m2 5 6 6 6-6" />
                  </svg>
                </div>
              </div>
            </summary>
            <div class="accordion-body">
              <p>Most recent added incomes go here.</p>
            </div>
          </details>
          <!-- Expenses -->
          <details class="accordion-item">
            <summary class="accordion-header">
              <div class="flex justify-between">
                <div class="flex flex-col">
                  <p class="text-2xl ml-2 font-semibold">Expenses</p>
                  <p class="text-3xl ml-2">$000.00</p>
                </div>
                <div class="flex items-center">
                  <img
                    src="svgs/add_plus.svg"
                    alt=""
                    width="40"
                    height="40"
                  /><svg
                    class="accordion-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    style="width: 32px; height: 32px"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m2 5 6 6 6-6" />
                  </svg>
                </div>
              </div>
            </summary>
            <div class="accordion-body">
              <p>Most recent added expenses go here.</p>
            </div>
          </details>
        </div>
      </div>
    </main>
    <!-- Bootstrap -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
