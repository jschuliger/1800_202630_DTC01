<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>
    
    <!-- Main content goes here -->
    <main class="container py-4" style="max-width: 560px;">
        <h1>Add Expense</h1>

        <form id="addExpenseForm" novalidate>
            <div class="mb-3">
                <label for="expenseAmountInput" class="form-label">Amount</label>
                <input type="number" id="expenseAmountInput" class="form-control" placeholder="0.00" required />
            </div>
            <div class="mb-3">
                <label for="expenseCategoryInput" class="form-label">Category</label>
                <select id="expenseCategoryInput" class="form-select">
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="expenseDate">Date:</label>
                <input type="date" id="expenseDate" name="expenseDate">
            </div>
            <div class="mb-3">
                <label for="expenseDescription" class="form-label">Description</label>
                <textarea id="expenseDescription" class="form-control" rows="3" placeholder=""></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
    </main>

    <!-- our own footer goes here -->
    <site-footer></site-footer>
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/addExpense.js"></script>
    <script>
        document.getElementById("expenseDate").value =
            new Date().toISOString().split("T")[0];
    </script>
    <script>
        (function() {
            const input = document.getElementById('expenseAmountInput');
            let rawValue = ''; // stores digits only

            input.addEventListener('input', function(e) {
                // Remove all non-digit characters
                rawValue = this.value.replace(/\D/g, '');

                // If empty, show 0.00
                if (rawValue.length === 0) {
                    this.value = '0.00';
                    return;
                }

                // Convert to cents and format
                let cents = parseInt(rawValue, 10);
                let formatted = (cents / 100).toFixed(2);

                this.value = formatted;
            });

            // Optional: prevent non-digit typing except control keys
            input.addEventListener('keydown', function(e) {
                const allowedKeys = [
                    'Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'
                ];
                if (!allowedKeys.includes(e.key) && !/\d/.test(e.key)) {
                    e.preventDefault();
                }
            });

            // Initialize
            input.value = '0.00';
        })();
    </script>

</body>

</html>
