<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finances</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  </head>
  <body>
    <!-- Desktop view is flexbox -->
    <div class="d-md-flex vh-md-100" style="height: 100vh">
      <!-- Side navbar / Hamburger menu -->
      <side-navbar></side-navbar>
      <!-- Main content -->
      <div
        class="d-flex flex-column flex-md-row flex-grow-1 min-w-0 h-100 overflow-auto overflow-md-hidden"
      >
        <!-- Net worth and chart -->
        <main
          class="px-4 pt-5 pb-2 p-md-5 d-flex flex-column flex-md-fill overflow-md-auto"
        >
          <div class="d-flex flex-column align-items-center">
            <h1 style="font-size: 3em" class="fw-bold text-primary">
              Finances
            </h1>
            <div class="d-flex align-items-center mt-5 gap-3">
              <svg
                xmlns="http://w3.org"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="currentColor"
                class="text-primary"
                style="cursor: pointer"
                id="left-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
              <p
                class="mb-0 fw-bold text-primary bg-accent border border-success-subtle rounded-pill py-1"
                id="month"
                style="font-size: 1.4em; width: 190px; text-align: center"
              >
                month
              </p>
              <svg
                xmlns="http://w3.org"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="currentColor"
                class="text-primary"
                style="transform: rotate(180deg); cursor: pointer"
                id="right-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
            </div>
          </div>
          <div class="d-flex justify-content-center mt-3">
            <p
              style="font-size: 4em"
              class="m-0 fw-bold text-primary"
              id="net-worth"
            >
              $000.00
            </p>
          </div>
          <donut-chart
            class="d-none d-md-flex justify-content-center"
          ></donut-chart>
        </main>

        <!-- Past transactions -->
        <div
          class="d-flex flex-column flex-fill px-3 pt-5 pb-3 p-md-5 mt-5"
          style="min-height: 0"
        >
          <div
            class="card d-flex flex-column border-0 rounded-4 shadow-sm overflow-hidden"
            style="min-height: 0"
          >
            <div
              class="card-header flex-shrink-0 bg-accent text-primary fw-bold border-bottom border-success-subtle py-3 px-4"
              style="font-size: 1.5rem"
            >
              Recent Transactions
            </div>
            <div
              id="transactions-list"
              class="card-body bg-white overflow-auto p-0"
            >
              <!-- Transactions appear here from finances.js -->
            </div>
          </div>

          <!-- Centered button below the transactions card -->
          <div class="d-flex justify-content-center flex-shrink-0 mt-3">
            <a
              class="btn btn-theme-solid rounded-pill px-4 py-2 fw-semibold shadow-sm"
              href="addTransaction.html"
            >
              + Add Transaction
            </a>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/components/donut-chart.js"></script>
    <script type="module" src="/src/components/side-navbar.js"></script>
    <script type="module" src="/src/finances.js"></script>
  </body>
</html>
