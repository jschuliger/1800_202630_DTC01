<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finances</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  </head>
  <body>
    <!-- Desktop view is flexbox -->
    <div class="d-md-flex vh-md-100" style="height: 100vh">
      <!-- SIde navbar / Hamburger menu -->
      <side-navbar></side-navbar>
      <!-- Main content -->
      <div
        class="d-flex flex-column flex-md-row flex-grow-1 min-w-0 h-100 overflow-auto overflow-md-hidden"
      >
        <!-- Net worth and chart -->
        <main class="p-4 p-md-5 d-flex flex-column flex-fill overflow-md-auto">
          <div class="d-flex flex-column align-items-center">
            <h1 style="font-size: 3em">Finances</h1>
            <div class="d-flex align-items-center mt-5 gap-3">
              <svg
                xmlns="http://w3.org"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#000000"
                id="left-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
              <p class="mb-1" id="month" style="font-size: 1.4em">month</p>
              <svg
                xmlns="http://w3.org"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#000000"
                style="transform: rotate(180deg)"
                id="right-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <p style="font-size: 4em" class="m-0" id="net-worth">$000.00</p>
          </div>
          <donut-chart
            class="d-none d-md-flex justify-content-center"
          ></donut-chart>
        </main>
        <!-- Past transactions -->
        <div
          class="d-flex flex-column flex-fill p-3 p-md-5"
          style="min-height: 0"
        >
          <div
            class="card d-flex flex-column"
            style="max-height: 100%; min-height: 0"
          >
            <div
              class="card-header flex-shrink-0"
              style="font-size: 2rem; background-color: rgb(246, 246, 246)"
            >
              Recent Transactions
            </div>
            <div id="transactions-list" class="card-body overflow-auto p-0">
              <!-- Transactions appear here from finances.js -->
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-center justify-between gap-4">
      <a class="flex justify-center btn btn-success mb-3" href="addIncome.html"
        >➕ Add Income</a
      >
      <a class="flex justify-center btn btn-success mb-3" href="addExpense.html"
        >➕ Add Expense</a
      >
    </div>
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/components/donut-chart.js"></script>
    <script type="module" src="/src/components/side-navbar.js"></script>
    <script type="module" src="/src/finances.js"></script>
  </body>
</html>
