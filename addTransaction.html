<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Transaction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <main class="container py-5" style="max-width: 560px">
      <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
        <div
          class="card-header bg-accent border-bottom border-success-subtle py-3 px-4"
        >
          <h1 class="h3 mb-0 fw-bold text-primary">Add Transaction</h1>
        </div>

        <div class="card-body bg-white p-4">
          <ul class="nav nav-pills nav-fill bg-light p-1 rounded-3 mb-4">
            <li class="nav-item">
              <button
                class="nav-link active fw-semibold theme-tab-income"
                data-bs-toggle="tab"
                data-bs-target="#income-tab"
                type="button"
              >
                Income
              </button>
            </li>

            <li class="nav-item">
              <button
                class="nav-link fw-semibold theme-tab-expense"
                data-bs-toggle="tab"
                data-bs-target="#expense-tab"
                type="button"
              >
                Expense
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- INCOME TAB -->
            <div class="tab-pane fade show active" id="income-tab">
              <form id="addIncomeForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold text-primary"
                    >Amount</label
                  >
                  <div class="input-group">
                    <span
                      class="input-group-text bg-accent text-primary fw-bold border-success-subtle"
                      >$</span
                    >
                    <input
                      type="text"
                      id="incomeAmountInput"
                      class="form-control theme-input"
                      placeholder="0.00"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-primary"
                    >Category</label
                  >
                  <select
                    id="incomeCategoryInput"
                    class="form-select theme-input"
                  >
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-primary"
                    >Date</label
                  >
                  <input
                    type="date"
                    id="incomeDate"
                    class="form-control theme-input"
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold text-primary"
                    >Description</label
                  >
                  <textarea
                    id="incomeDescription"
                    class="form-control theme-input"
                    rows="2"
                  ></textarea>
                </div>

                <div class="d-flex gap-2">
                  <button
                    type="submit"
                    class="btn btn-theme-solid rounded-pill py-2 fw-semibold flex-fill"
                  >
                    Submit Income
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary rounded-pill py-2 fw-semibold flex-fill"
                    onclick="history.back()"
                  >
                    Cancel
                  </button>
                </div>
              </form>
            </div>

            <!-- EXPENSE TAB -->
            <div class="tab-pane fade" id="expense-tab">
              <form id="addExpenseForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold text-primary"
                    >Amount</label
                  >
                  <div class="input-group">
                    <span class="input-group-text bg-light text-primary fw-bold"
                      >$</span
                    >
                    <input
                      type="text"
                      id="expenseAmountInput"
                      class="form-control theme-input"
                      placeholder="0.00"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-primary"
                    >Category</label
                  >
                  <select
                    id="expenseCategoryInput"
                    class="form-select theme-input"
                  >
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-primary"
                    >Date</label
                  >
                  <input
                    type="date"
                    id="expenseDate"
                    class="form-control theme-input"
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold text-primary"
                    >Description</label
                  >
                  <textarea
                    id="expenseDescription"
                    class="form-control theme-input"
                    rows="2"
                  ></textarea>
                </div>

                <div class="d-flex gap-2">
                  <button
                    type="submit"
                    class="btn btn-expense-solid rounded-pill py-2 fw-semibold flex-fill"
                  >
                    Submit Expense
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary rounded-pill py-2 fw-semibold flex-fill"
                    onclick="history.back()"
                  >
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/addTransaction.js"></script>
    <script type="module" src="/src/addIncome.js"></script>
    <script type="module" src="/src/addExpense.js"></script>
  </body>
</html>
