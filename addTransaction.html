<!doctype html>
<html lang="en">
  <main class="container py-4" style="max-width: 560px">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <h1>Add Transaction</h1>

    <ul class="nav nav-tabs mb-4">
      <li class="nav-item">
        <button
          class="nav-link active"
          data-bs-toggle="tab"
          data-bs-target="#income-tab"
          type="button"
        >
          Income
        </button>
      </li>

      <li class="nav-item">
        <button
          class="nav-link"
          data-bs-toggle="tab"
          data-bs-target="#expense-tab"
          type="button"
        >
          Expense
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- INCOME TAB -->
      <div class="tab-pane fade show active" id="income-tab">
        <form id="addIncomeForm">
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input
              type="text"
              id="incomeAmountInput"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Category</label>

            <select id="incomeCategoryInput" class="form-select">
              <option value="Salary">Salary</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label>Date</label>

            <input type="date" id="incomeDate" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea id="incomeDescription" class="form-control"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
              Submit
            </button>
            <button
              type="button"
              class="btn btn-secondary flex-fill"
              onclick="history.back()"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>

      <!-- EXPENSE TAB -->
      <div class="tab-pane fade" id="expense-tab">
        <form id="addExpenseForm">
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input
              type="text"
              id="expenseAmountInput"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>

            <select id="expenseCategoryInput" class="form-select">
              <option value="Food">Food</option>
              <option value="Transportation">Transportation</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Date</label>
            <input type="date" id="expenseDate" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="expenseDescription" class="form-control"></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
              Submit
            </button>
            <button
              type="button"
              class="btn btn-secondary flex-fill"
              onclick="history.back()"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/addTransaction.js"></script>
  <script type="module" src="/src/addIncome.js"></script>
  <script type="module" src="/src/addExpense.js"></script>
</html>
