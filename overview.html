<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  </head>
  <body>
    <div class="d-md-flex">
      <!-- Side navbar / Hamburger menu -->
      <side-navbar></side-navbar>
      <!-- Desktop view (main without accordion dropdowns, and larger income/expense view) -->
      <div class="d-flex w-100">
        <!-- Overview title, month, net worth, graph, and mobile-only accordion dropdowns -->
        <main class="p-5 d-flex flex-column flex-md-wrap w-100 w-md-50">
          <div class="d-flex flex-column align-items-center">
            <!-- Overview title and month change -->
            <h1 style="font-size: 3em" class="">Overview</h1>
            <div class="d-flex align-items-center mt-5 gap-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#000000"
                id="left-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
              <p class="mb-1" id="month" style="font-size: 1.4em">month</p>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#000000"
                style="transform: rotate(180deg)"
                id="right-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <p style="font-size: 4em" class="m-0" id="net-worth">$000.00</p>
          </div>
          <!-- Donut chart and buttons -->
          <donut-chart></donut-chart>
          <!-- Accordion menu -->
          <accordion-menu class="d-md-none"></accordion-menu>
        </main>
        <!-- Desktop-view larger income/expenses -->
        <div class="d-none d-md-flex w-50">
          <accordion-menu></accordion-menu>
          <!-- Income -->
          <!-- <div class="w-50">
            <p>Income</p>
          </div> -->
          <!-- Expenses -->
          <!-- <div class="w-50">
            <p>Expenses</p>
          </div> -->
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-center justify-between gap-4">
      <a class="flex justify-center btn btn-success mb-3" href="addIncome.html"
        >➕ Add Income</a
      >
      <a class="flex justify-center btn btn-success mb-3" href="addExpense.html"
        >➕ Add Expense</a
      >
    </div>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/components/donut-chart.js"></script>
    <script type="module" src="/src/components/accordion-menu.js"></script>
    <script type="module" src="/src/components/side-navbar.js"></script>
  </body>
</html>
