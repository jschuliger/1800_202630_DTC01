<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  </head>
  <body>
    <div class="d-md-flex">
      <!-- Hamburger menu -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="70px"
        viewBox="0 -960 960 960"
        width="70px"
        fill="#000000"
        class="position-absolute d-md-none"
        style="
          top: 5%;
          left: 5%;
          background-color: lightgrey;
          border-radius: 10px;
        "
      >
        <path
          d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
        />
      </svg>
      <!-- Side navbar for desktop view -->
      <aside
        id="side-navbar"
        class="d-none d-md-block"
        style="background-color: lightgrey; min-width: 220px; max-width: 220px"
      >
        <ul
          class="nav nav-pills flex-column p-3 align-items-start justify-content-around"
          style="height: 400px; font-size: 1.7em"
        >
          <li class="nav-item">
            <a href="#" class="nav-link active">Overview</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Finances</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Categories</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Graphs</a>
          </li>
        </ul>
      </aside>
      <!-- Desktop view (main without accordion dropdowns, and larger income/expense view) -->
      <div class="d-flex w-100">
        <!-- Overview title, month, net worth, graph, and mobile-only accordion dropdowns -->
        <main class="p-5 d-flex flex-column flex-md-wrap w-100 w-md-50">
          <div class="d-flex flex-column align-items-center">
            <!-- Overview title and month change -->
            <h1 style="font-size: 3em" class="">Overview</h1>
            <div class="d-flex align-items-center mt-5 gap-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#000000"
                id="left-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
              <p class="mb-1" id="month" style="font-size: 1.4em">month</p>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#000000"
                style="transform: rotate(180deg)"
                id="right-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <p style="font-size: 4em" class="m-0" id="net-worth">$000.00</p>
          </div>
          <!-- Donut chart and buttons -->
          <donut-chart></donut-chart>
          <!-- Accordion menu -->
          <accordion-menu></accordion-menu>
        </main>
        <!-- Desktop-view larger income/expenses -->
        <div class="d-none d-md-flex w-50">
          <!-- Income -->
          <div class="w-50">
            <p>Income</p>
          </div>
          <!-- Expenses -->
          <div class="w-50">
            <p>Expenses</p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/components/donut-chart.js"></script>
    <script type="module" src="/src/components/accordion-menu.js"></script>
  </body>
</html>
