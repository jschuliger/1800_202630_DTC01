<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <div class="d-md-flex">
      <!-- Side navbar / Hamburger menu -->
      <side-navbar></side-navbar>
      <!-- Desktop view (main without accordion dropdowns, and larger income/expense view) -->
      <div class="d-flex w-100">
        <!-- Overview title, month, net worth, graph, and mobile-only accordion dropdowns -->
        <main class="p-5 d-flex flex-column flex-md-wrap w-100 w-md-50">
          <div class="d-flex flex-column align-items-center">
            <!-- Overview title and month change -->
            <h1 style="font-size: 3em" class="fw-bold text-primary">Overview</h1>
            <div class="d-flex align-items-center mt-5 gap-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="currentColor"
                class="text-primary"
                style="cursor: pointer"
                id="left-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
              <p
                class="mb-0 fw-bold text-primary bg-accent border border-success-subtle rounded-pill py-1"
                id="month"
                style="font-size: 1.4em; width: 190px; text-align: center"
              >
                month
              </p>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="currentColor"
                class="text-primary"
                style="transform: rotate(180deg); cursor: pointer"
                id="right-arrow"
              >
                <path
                  d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"
                />
              </svg>
            </div>
          </div>
          <div class="d-flex justify-content-center mt-3">
            <p style="font-size: 4em" class="m-0 fw-bold text-primary" id="net-worth">$000.00</p>
          </div>
          <!-- Donut chart and buttons -->
          <donut-chart class="mx-auto"></donut-chart>
          <!-- Accordion menu -->
          <accordion-menu></accordion-menu>
        </main>
      </div>
    </div>
    <div class="d-flex justify-content-center">
      <a class="btn btn-theme-solid rounded-pill px-4 py-2 fw-semibold shadow-sm mb-4" href="addTransaction.html">
        + Add Transaction
      </a>
    </div>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/components/donut-chart.js"></script>
    <script type="module" src="/src/components/accordion-menu.js"></script>
    <script type="module" src="/src/components/side-navbar.js"></script>
  </body>
</html>
