<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  </head>
  <body>
    <!-- Hamburger menu -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="#000000"
      class="position-absolute d-md-none"
    >
      <path
        d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
      />
    </svg>
    <!-- Overview and month change -->
    <main class="p-5">
      <div class="d-flex flex-column align-items-center">
        <h1 style="font-size: 3em">Overview</h1>
        <div class="bg-success-subtle d-flex align-items-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#000000"
            id="left-arrow"
          >
            <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
          </svg>
          <p id="month">month</p>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#000000"
            style="transform: rotate(180deg)"
            id="right-arrow"
          >
            <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
          </svg>
        </div>
      </div>
      <div class="d-flex justify-content-center fs-1">
        <p id="net-worth">$000.00</p>
      </div>
      <!-- Donut chart and buttons -->
      <section class="d-flex flex-column align-items-center gap-4">
        <div
          class="btn-group"
          role="group"
          aria-label="Basic radio toggle button group"
          id="donut-type"
        >
          <input
            type="radio"
            class="btn-check"
            name="donut-types"
            id="donut-incomes"
            value="incomes"
            checked
          />
          <label class="btn btn-outline-success" for="donut-incomes"
            >Income</label
          >
          <input
            type="radio"
            class="btn-check"
            name="donut-types"
            id="donut-expenses"
            value="expenses"
          />
          <label class="btn btn-outline-success" for="donut-expenses"
            >Expenses</label
          >
          <input
            type="radio"
            class="btn-check"
            name="donut-types"
            id="donut-net-worth"
            value="net-worth"
          />
          <label class="btn btn-outline-success" for="donut-net-worth"
            >Net Worth</label
          >
        </div>
        <!-- Donut chart -->
        <div>
          <canvas id="donut-chart"></canvas>
        </div>
      </section>
      <!-- Accordion menu -->
      <section>
        <div class="accordion" id="accordionPanelsStayOpenExample">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button
                class="accordion-button fs-1"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#panelsStayOpen-collapseOne"
                aria-expanded="true"
                aria-controls="panelsStayOpen-collapseOne"
              >
                <div>
                  <p>Incomes</p>
                  <p id="accordion-incomes">$000.00</p>
                </div>
              </button>
            </h2>
            <div
              id="panelsStayOpen-collapseOne"
              class="accordion-collapse collapse show"
            >
              <div
                class="accordion-body pt-0"
                id="accordion-incomes-body"
              ></div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button
                class="accordion-button collapsed fs-1"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#panelsStayOpen-collapseTwo"
                aria-expanded="false"
                aria-controls="panelsStayOpen-collapseTwo"
              >
                <div>
                  <p>Expenses</p>
                  <p id="accordion-expenses">$000.00</p>
                </div>
              </button>
            </h2>
            <div
              id="panelsStayOpen-collapseTwo"
              class="accordion-collapse collapse"
            >
              <div class="accordion-body" id="accordion-expenses-body"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
